<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Վերականգնել գաղտնաբառը — Դպրոցական պորտֆոլիո</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('site_theme') || 'light');</script>
</head>
<body>

<main class="center-box">
  <h1 data-i18n="forgot.title">Վերականգնել գաղտնաբառը</h1>
  <p class="muted" data-i18n="forgot.subtitle">Մուտքագրեք ձեր էլ. հասցեն, կուղարկենք հղում գաղտնաբառը փոխելու համար։</p>

  <form id="forgot-form">
    <label for="email" data-i18n="forgot.email">Էլ. հասցե</label>
    <input type="email" id="email" required autocomplete="email">

    <div class="form-actions">
      <button type="submit" id="submit-btn" data-i18n="forgot.submit">Ուղարկել հղումը</button>
    </div>
    <p class="error-msg" id="error-msg" style="display:none;"></p>
    <p class="success-msg" id="success-msg" style="display:none;"></p>
  </form>

  <hr class="divider">
  <p class="small"><a href="index.html" data-i18n="forgot.backToLogin">Վերադառնալ մուտք գործելուն</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/i18n.js"></script>
<script>
  const form = document.getElementById('forgot-form');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = t('forgot.submitting');

    const email = document.getElementById('email').value.trim();
    const redirectTo = window.location.origin + '/reset-password';

    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

    // Специально не раскрываем, существует ли такой email — одинаковое
    // сообщение в обоих случаях, чтобы нельзя было угадывать почты учеников.
    if (error) {
      console.error(error);
    }
    successMsg.textContent = t('forgot.success');
    successMsg.style.display = 'block';
    form.reset();
    submitBtn.disabled = false;
    submitBtn.textContent = t('forgot.submit');
  });
</script>
</body>
</html>
