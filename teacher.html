<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ուսուցչի համար — Դպրոցական պորտֆոլիո</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('site_theme') || 'light');</script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="container">
  <div class="tabs">
    <button class="active" data-tab="events" data-i18n="teacher.tabEvents">Իմ միջոցառումները</button>
    <button data-tab="portfolios" data-i18n="teacher.tabPortfolios">Աշակերտների պորտֆոլիո</button>
  </div>

  <!-- ---------- Вкладка: события ---------- -->
  <section id="tab-events">
    <div class="section-title">
      <h2 data-i18n="teacher.createTitle">Ստեղծել միջոցառում</h2>
    </div>
    <div class="card plain">
      <form id="event-form">
        <label for="ev-title" data-i18n="event.titleLabel">Վերնագիր</label>
        <input type="text" id="ev-title" required>

        <label for="ev-description" data-i18n="event.descriptionLabel">Նկարագրություն</label>
        <textarea id="ev-description"></textarea>

        <div class="grid-2">
          <div>
            <label for="ev-datetime" data-i18n="event.datetimeLabel">Ամսաթիվ և ժամ</label>
            <input type="datetime-local" id="ev-datetime" required>
          </div>
          <div>
            <label for="ev-location" data-i18n="event.locationLabel">Վայր</label>
            <input type="text" id="ev-location">
          </div>
        </div>

        <label for="ev-max" data-i18n="event.maxLabel">Առավելագույն մասնակիցներ (ոչ պարտադիր)</label>
        <input type="number" id="ev-max" min="1">

        <div class="form-actions">
          <button type="submit" id="save-event-btn" data-i18n="event.create">Ստեղծել միջոցառում</button>
        </div>
        <p class="error-msg" id="event-error" style="display:none;"></p>
      </form>
    </div>

    <h2 data-i18n="teacher.myEventsTitle">Իմ միջոցառումները և գրանցվածները</h2>
    <div id="my-created-events"><p class="muted">...</p></div>
  </section>

  <!-- ---------- Вкладка: портфолио учеников ---------- -->
  <section id="tab-portfolios" style="display:none;">
    <h2 data-i18n="teacher.tabPortfolios">Աշակերտների պորտֆոլիո</h2>
    <input type="text" id="student-search" data-i18n-placeholder="teacher.searchPlaceholder" placeholder="Որոնել ըստ անվան, ազգանվան կամ դասարանի...">
    <div id="students-list" style="margin-top:16px;"><p class="muted">...</p></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
