<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Իմ պորտֆոլիոն — Դպրոցական պորտֆոլիո</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('site_theme') || 'light');</script>
</head>
<body>

<header class="app-header" id="app-header"></header>

<main class="container">
  <div class="tabs">
    <button class="active" data-tab="portfolio" data-i18n="dashboard.tabPortfolio">Պորտֆոլիո</button>
    <button data-tab="events" data-i18n="dashboard.tabEvents">Իմ գրանցումները</button>
  </div>

  <!-- ---------- Вкладка: портфолио ---------- -->
  <section id="tab-portfolio">

    <!-- Аватар -->
    <div class="card plain card-row" id="avatar-row">
      <div style="display:flex; align-items:center; gap:14px;">
        <img id="avatar-preview" src="" alt="" style="display:none; width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--line);">
        <div>
          <div data-i18n="dashboard.avatarLabel" class="small muted">Ձեր նկարը</div>
          <label class="btn secondary small" style="margin-top:6px; display:inline-block;">
            <span data-i18n="dashboard.avatarUpload">Փոխել նկարը</span>
            <input type="file" id="avatar-input" accept="image/*" style="display:none;">
          </label>
        </div>
      </div>
    </div>
    <p class="error-msg" id="avatar-error" style="display:none;"></p>

    <div class="section-title">
      <h2 data-i18n="dashboard.title">Իմ պորտֆոլիոն</h2>
      <button id="add-item-btn" data-i18n="dashboard.addItem">+ Ավելացնել աշխատանք</button>
    </div>

    <p class="small muted" id="public-link-line"></p>
    <div class="card plain" style="text-align:center; max-width:220px;">
      <p class="small muted" data-i18n="dashboard.qrLabel">QR-код ձեր պորտֆոլիոյի</p>
      <canvas id="qr-canvas"></canvas>
      <p class="hint" data-i18n="dashboard.qrHint">Ցուցադրեք այս կոդը, որպեսզի ուրիշները արագ բացեն ձեր պորտֆոլիոն։</p>
    </div>

    <div id="portfolio-form-wrap" style="display:none;" class="card plain">
      <h3 id="form-title" data-i18n="dashboard.formTitleNew">Նոր աշխատանք</h3>
      <form id="portfolio-form">
        <input type="hidden" id="item-id">
        <label for="item-title" data-i18n="item.titleLabel">Վերնագիր</label>
        <input type="text" id="item-title" required>

        <label for="item-category" data-i18n="item.categoryLabel">Կատեգորիա</label>
        <select id="item-category">
          <option value="project" data-i18n="category.project">Նախագիծ</option>
          <option value="achievement" data-i18n="category.achievement">Ձեռքբերում</option>
          <option value="certificate" data-i18n="category.certificate">Վկայական</option>
          <option value="creative" data-i18n="category.creative">Ստեղծագործական աշխատանք</option>
        </select>

        <label for="item-date" data-i18n="item.dateLabel">Ամսաթիվ</label>
        <input type="date" id="item-date">

        <label for="item-description" data-i18n="item.descriptionLabel">Նկարագրություն</label>
        <textarea id="item-description"></textarea>

        <label for="item-event" data-i18n="item.eventLabel">Կապել մասնակցած միջոցառման հետ (ոչ պարտադիր)</label>
        <select id="item-event">
          <option value="" data-i18n="item.eventNone">— չկա —</option>
        </select>

        <label data-i18n="item.attachmentsLabel">Ֆայլեր և հղումներ</label>
        <div id="existing-attachments"></div>
        <div id="attachment-rows"></div>
        <div style="display:flex; gap:8px; margin-top:6px;">
          <button type="button" class="secondary small" id="add-file-row" data-i18n="item.addFile">+ Ֆայլ</button>
          <button type="button" class="secondary small" id="add-link-row" data-i18n="item.addLink">+ Հղում</button>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-item-btn" data-i18n="save">Պահպանել</button>
          <button type="button" class="secondary" id="cancel-item-btn" data-i18n="cancel">Չեղարկել</button>
        </div>
        <p class="error-msg" id="item-error" style="display:none;"></p>
      </form>
    </div>

    <div id="portfolio-list"><p class="muted">...</p></div>
  </section>

  <!-- ---------- Вкладка: мои события ---------- -->
  <section id="tab-events" style="display:none;">
    <h2 data-i18n="events.myTitle">Իմ գրանցումները միջոցառումների</h2>
    <div id="my-events-list"><p class="muted">...</p></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
