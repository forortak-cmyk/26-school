<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Регистрация — Школьное портфолио</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="center-box">
  <h1>Регистрация</h1>
  <p class="muted">Создайте аккаунт ученика.</p>

  <form id="register-form">
    <div class="grid-2">
      <div>
        <label for="first-name">Имя</label>
        <input type="text" id="first-name" required>
      </div>
      <div>
        <label for="last-name">Фамилия</label>
        <input type="text" id="last-name" required>
      </div>
    </div>

    <label for="class">Класс</label>
    <input type="text" id="class" placeholder="например, 10-Б" required>

    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Пароль</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">
    <p class="hint">Минимум 6 символов.</p>

    <div class="form-actions">
      <button type="submit" id="submit-btn">Зарегистрироваться</button>
    </div>
    <p class="error-msg" id="error-msg" style="display:none;"></p>
    <p class="success-msg" id="success-msg" style="display:none;"></p>
  </form>

  <hr class="divider">
  <p class="small">Уже есть аккаунт? <a href="index.html">Войти</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
  const form = document.getElementById('register-form');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Регистрируем...';

    const first_name = document.getElementById('first-name').value.trim();
    const last_name = document.getElementById('last-name').value.trim();
    const studentClass = document.getElementById('class').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Данные попадают в raw_user_meta_data и подхватываются триггером
    // handle_new_user() на стороне БД, который создаёт запись в profiles.
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: { first_name, last_name, class: studentClass }
      }
    });

    if (error) {
      errorMsg.textContent = 'Не удалось зарегистрироваться: ' + error.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Зарегистрироваться';
      return;
    }

    // Если в проекте включено подтверждение email, сессии ещё не будет.
    if (data.session) {
      window.location.href = 'dashboard.html';
    } else {
      successMsg.textContent = 'Аккаунт создан. Проверьте почту и подтвердите email, затем войдите.';
      successMsg.style.display = 'block';
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Зарегистрироваться';
    }
  });
</script>
</body>
</html>
