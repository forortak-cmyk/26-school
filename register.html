<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Գրանցում — Դպրոցական պորտֆոլիո</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('site_theme') || 'light');</script>
</head>
<body>

<main class="center-box">
  <h1 data-i18n="register.title">Գրանցում</h1>
  <p class="muted" data-i18n="register.subtitle">Ստեղծեք աշակերտի հաշիվ։</p>

  <form id="register-form">
    <div class="grid-2">
      <div>
        <label for="first-name" data-i18n="register.firstName">Անուն</label>
        <input type="text" id="first-name" required>
      </div>
      <div>
        <label for="last-name" data-i18n="register.lastName">Ազգանուն</label>
        <input type="text" id="last-name" required>
      </div>
    </div>

    <label for="class" data-i18n="register.class">Դասարան</label>
    <select id="class" required>
      <option value="10-1">10-1</option>
      <option value="10-2">10-2</option>
      <option value="10-3">10-3</option>
      <option value="10-4">10-4</option>
      <option value="11-1">11-1</option>
      <option value="11-2">11-2</option>
      <option value="11-3">11-3</option>
      <option value="12-1">12-1</option>
      <option value="12-2">12-2</option>
      <option value="12-3">12-3</option>
    </select>

    <label for="email" data-i18n="register.email">Էլ. հասցե</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password" data-i18n="register.password">Գաղտնաբառ</label>
    <input type="password" id="password" required minlength="6" autocomplete="new-password">
    <p class="hint" data-i18n="register.passwordHint">Առնվազն 6 նիշ։</p>

    <div class="form-actions">
      <button type="submit" id="submit-btn" data-i18n="register.submit">Գրանցվել</button>
    </div>
    <p class="error-msg" id="error-msg" style="display:none;"></p>
    <p class="success-msg" id="success-msg" style="display:none;"></p>
  </form>

  <hr class="divider">
  <p class="small"><span data-i18n="register.haveAccount">Արդեն ունե՞ք հաշիվ։</span> <a href="index.html" data-i18n="register.login">Մուտք</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/i18n.js"></script>
<script>
  const form = document.getElementById('register-form');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = t('register.submitting');

    const first_name = document.getElementById('first-name').value.trim();
    const last_name = document.getElementById('last-name').value.trim();
    const studentClass = document.getElementById('class').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Данные попадают в raw_user_meta_data и подхватываются триггером
    // handle_new_user() на стороне БД, который создаёт запись в profiles.
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        data: { first_name, last_name, class: studentClass }
      }
    });

    if (error) {
      errorMsg.textContent = t('register.errorPrefix') + error.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = t('register.submit');
      return;
    }

    // Если в проекте включено подтверждение email, сессии ещё не будет.
    if (data.session) {
      window.location.href = 'dashboard.html';
    } else {
      successMsg.textContent = t('register.success');
      successMsg.style.display = 'block';
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = t('register.submit');
    }
  });
</script>
</body>
</html>
