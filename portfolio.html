<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Портфолио ученика</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <span class="brand">Школьное портфолио</span>
</header>

<main class="container" id="main-content">
  <p class="muted">Загрузка...</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/common.js"></script>
<script>
  const categoryLabels = {
    project: 'Проект',
    achievement: 'Достижение',
    certificate: 'Сертификат',
    creative: 'Творческая работа',
  };

  (async () => {
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('id');
    const content = document.getElementById('main-content');

    if (!userId) {
      content.innerHTML = '<div class="empty-state">Ссылка на портфолио не указана.</div>';
      return;
    }

    // Работает без авторизации: profiles и portfolio_items открыты на select
    // для анонимных пользователей (см. RLS-политики portfolio_select_anon,
    // profiles_select_anon в sql/schema.sql).
    const { data: profile, error: profileError } = await sb
      .from('profiles')
      .select('first_name, last_name, class')
      .eq('id', userId)
      .single();

    if (profileError || !profile) {
      content.innerHTML = '<div class="empty-state">Портфолио не найдено.</div>';
      return;
    }

    const { data: items, error: itemsError } = await sb
      .from('portfolio_items')
      .select('*')
      .eq('user_id', userId)
      .order('item_date', { ascending: false, nullsFirst: false });

    let itemsHtml;
    if (itemsError || !items || !items.length) {
      itemsHtml = '<div class="empty-state">Портфолио пока пустое.</div>';
    } else {
      itemsHtml = items.map(item => `
        <div class="card">
          <span class="category-tag">${categoryLabels[item.category] || item.category}</span>
          <h3 style="display:inline;">${escapeHtml(item.title)}</h3>
          <p class="meta-line">${item.item_date ? formatDate(item.item_date) : ''}</p>
          ${item.description ? `<p>${escapeHtml(item.description)}</p>` : ''}
          ${item.file_url ? `<p><a href="${item.file_url}" target="_blank">Открыть файл</a></p>` : ''}
          ${item.external_link ? `<p><a href="${item.external_link}" target="_blank">Внешняя ссылка</a></p>` : ''}
        </div>
      `).join('');
    }

    content.innerHTML = `
      <h1>${escapeHtml(profile.first_name)} ${escapeHtml(profile.last_name)}</h1>
      <p class="muted">Класс: ${escapeHtml(profile.class || '—')}</p>
      <hr class="divider">
      ${itemsHtml}
    `;
  })();
</script>
</body>
</html>
